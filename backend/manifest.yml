name: FoodApp
entities:
  User:
    authenticable: true
    properties:
      - name
      - { name: email, type: email }
      - { name: role, type: choice, options: { values: [customer, owner, admin], default: customer } }
    policies:
      create:
        - access: admin
      read:
        - { access: restricted, allow: User, condition: self }
        - access: admin
      update:
        - { access: restricted, allow: User, condition: self }
        - access: admin
      delete:
        - access: admin
      signup:
        - access: public

  Restaurant:
    properties:
      - { name: title, type: string }
      - { name: description, type: text }
      - { name: address, type: string }
      - { name: heroImage, type: image, options: { sizes: { thumbnail: { width: 400, height: 300 }, large: { width: 1200, height: 800 } } } }
    belongsTo:
      - { name: owner, entity: User }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - access: public
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - { access: restricted, allow: User, condition: self }

  MenuItem:
    properties:
      - { name: title, type: string }
      - { name: description, type: text }
      - { name: price, type: money, options: { currency: 'USD' } }
      - { name: itemImage, type: image, options: { sizes: { thumbnail: { width: 200, height: 200 } } } }
    belongsTo:
      - { name: restaurant, entity: Restaurant }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - access: public
      update:
        - { access: restricted, allow: User }
      delete:
        - { access: restricted, allow: User }

  Order:
    properties:
      - { name: status, type: choice, options: { values: [pending, confirmed, delivered, cancelled], default: pending } }
      - { name: totalPrice, type: money, options: { currency: 'USD' } }
      - { name: itemsJson, type: text, options: { label: 'Items (JSON)' } } 
    belongsTo:
      - { name: customer, entity: User }
      - { name: restaurant, entity: Restaurant }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - { access: restricted, allow: User, condition: self }
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - access: admin


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck